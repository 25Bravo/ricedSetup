# ---------------------------------------------------------
# 🟩 FONTS & TYPOGRAPHY
# ---------------------------------------------------------
# Requires 'Hack Nerd Font' installed on your system
font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size        12.0

# ---------------------------------------------------------
# 🟩 CURSOR TWEAKS (Matrix Fluidity)
# ---------------------------------------------------------
cursor           #00ff66
cursor_text_color #000000
cursor_shape     block
# Smooth cursor movement trail (supported in newer Kitty versions)
cursor_trail     3
cursor_trail_decay 0.1 0.4

# ---------------------------------------------------------
# 🟩 WINDOW LAYOUT & TRANSPARENCY
# ---------------------------------------------------------
background_opacity 0.88
background_blur    20
window_padding_width 12
remember_window_size  yes
initial_window_width  940
initial_window_height 600
hide_window_decorations yes

# ---------------------------------------------------------
# 🟩 HACKER GREEN GLOW COLOR SCHEME
# ---------------------------------------------------------
background #0a0f0d
foreground #00ff66

# Black
color0 #101512
color8 #4d5752

# Red (Alerts)
color1 #ff3366
color9 #ff6688

# Green (Primary Matrix)
color2 #00ff66
color10 #33ff99

# Yellow / Amber
color3 #ffaa00
color11 #ffcc00

# Blue (Deep Net)
color4 #0066ff
color12 #3399ff

# Magenta
color5 #cc00ff
color13 #ff66ff

# Cyan (Data streams)
color6 #00f0ff
color14 #66f4ff

# White
color7 #e6ebd8
color15 #f2f5eb

# Selection Highlight
selection_foreground #000000
selection_background #00ff66

# ---------------------------------------------------------
# 🟩 TABS & STATUS METER
# ---------------------------------------------------------
active_tab_foreground   #000000
active_tab_background   #00ff66
inactive_tab_foreground #4d5752
inactive_tab_background #101512
tab_bar_style           powerline

# ---------------------------------------------------------
# 🟩 MISC TERMINAL BEHAVIOR
# ---------------------------------------------------------
enable_audio_bell no
copy_on_select yes
confirm_os_window_close 0
g
